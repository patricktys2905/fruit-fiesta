<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#36c5e0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Fruit Fiesta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="A bright, juicy match-3 puzzle game. Match, splash and party with the family. Plays offline." />
    <title>Fruit Fiesta</title>
  </head>
  <body>
    <div id="scenery" aria-hidden="true">
      <div class="sun"></div>
      <div class="sea"></div>
      <div class="sand"></div>
    </div>

    <!-- Game screen -->
    <div id="app" class="hidden">
      <header id="hud">
        <div class="hud-top">
          <button id="btn-back" class="icon-btn" aria-label="Back to levels">‹</button>
          <div id="level-name"></div>
          <button id="btn-sound" class="icon-btn" aria-label="Toggle sound">🔊</button>
        </div>
        <div class="hud-panel">
          <div class="moves-box">
            <span class="label">Moves</span>
            <span id="moves">0</span>
          </div>
          <div class="score-box">
            <span class="label">Score</span>
            <div id="score">0</div>
            <div id="bar">
              <div id="bar-fill"></div>
              <span class="bar-star">★</span><span class="bar-star">★</span><span class="bar-star">★</span>
            </div>
          </div>
          <div class="goals-box">
            <span class="label">Goal</span>
            <div id="goals"></div>
          </div>
        </div>
      </header>
      <section id="cafe" class="cafe hidden" aria-label="Café orders"></section>
      <main id="board-wrap"><canvas id="board"></canvas></main>
      <div id="booster-bar" class="booster-bar">
        <button id="bst-hammer" class="bst-btn" aria-label="Fruit Hammer">🔨<b></b></button>
        <button id="bst-shuffle" class="bst-btn" aria-label="Shuffle">🔀<b></b></button>
      </div>
      <div id="tilt-bar" class="tilt-bar hidden" aria-label="Tilt the island">
        <span class="tilt-label">Tilt</span>
        <button class="tilt-btn" data-dir="left" aria-label="Tilt left">⬅</button>
        <button class="tilt-btn" data-dir="up" aria-label="Tilt up">⬆</button>
        <button class="tilt-btn" data-dir="down" aria-label="Tilt down">⬇</button>
        <button class="tilt-btn" data-dir="right" aria-label="Tilt right">➡</button>
        <span class="tilt-cost">1 move</span>
      </div>
    </div>

    <!-- Title screen -->
    <section id="screen-title" class="screen">
      <div class="title-top"><span id="title-lives" class="lives-pill"></span><span id="title-coins" class="lives-pill coins-pill"></span></div>
      <div class="logo" id="logo">
        <span class="logo-fruit">Fruit</span>
        <span class="logo-fiesta">Fiesta!</span>
      </div>
      <div id="title-fruits" class="title-fruits"></div>
      <button id="btn-play" class="big-btn">Play</button>
      <div class="title-row">
        <button id="btn-hub" class="pill-btn hub-btn">🎪 Fiesta Hub <span id="hub-badge" class="badge hidden"></span></button>
        <button id="btn-daily" class="pill-btn">📅 Daily <span id="daily-badge" class="badge hidden"></span></button>
        <button id="btn-awards" class="pill-btn">🏆</button>
      </div>
      <p class="tagline">Match, splash &amp; party with the family</p>
      <button id="btn-install" class="install-btn hidden">📲 Install app</button>
      <p id="ios-hint" class="ios-hint hidden">To install: tap <b>Share</b> then <b>Add to Home Screen</b></p>
    </section>

    <div id="toast" class="toast hidden" role="status"></div>

    <!-- Daily quests / awards panel -->
    <div id="panel" class="modal hidden" role="dialog" aria-modal="true">
      <div class="card panel-card">
        <button id="panel-close" class="lc-close" aria-label="Close">×</button>
        <button id="panel-back" class="lc-close panel-back hidden" aria-label="Back to Fiesta Hub">‹</button>
        <h2 id="panel-title"></h2>
        <p id="panel-sub" class="panel-sub"></p>
        <div id="panel-body" class="panel-body"></div>
      </div>
    </div>

    <!-- Out of moves: continue? -->
    <div id="continue" class="modal hidden" role="dialog" aria-modal="true">
      <div class="card">
        <h2>Out of moves!</h2>
        <p class="confirm-text" id="cont-text"></p>
        <div class="modal-btns">
          <button id="cont-quit" class="mid-btn ghost">Give up</button>
          <button id="cont-use" class="mid-btn">➕ 5 moves</button>
        </div>
      </div>
    </div>

    <!-- Leave level confirmation -->
    <div id="confirm" class="modal hidden" role="dialog" aria-modal="true">
      <div class="card">
        <h2>Leave level?</h2>
        <p class="confirm-text">You'll lose a life ❤️</p>
        <div class="modal-btns">
          <button id="confirm-leave" class="mid-btn ghost">Leave</button>
          <button id="confirm-stay" class="mid-btn">Keep playing</button>
        </div>
      </div>
    </div>

    <!-- Level select -->
    <section id="screen-levels" class="screen hidden">
      <div class="levels-head">
        <button id="btn-levels-back" class="icon-btn" aria-label="Back">‹</button>
        <div class="world-banner"><span class="world-sub" id="world-sub">World 1</span><span class="world-name" id="world-name">Sunny Isle</span></div>
        <span id="total-stars" class="total-stars"></span>
      </div>
      <div class="meta-bar">
        <span id="map-lives" class="lives-pill"></span>
        <span id="map-coins" class="lives-pill coins-pill"></span>
        <button id="map-hub" class="pill-btn small">🎪 <span id="map-hub-badge" class="badge hidden"></span></button>
        <button id="map-daily" class="pill-btn small hidden">📅 <span id="map-daily-count"></span></button>
        <button id="map-awards" class="pill-btn small hidden">🏆 <span id="map-awards-count"></span></button>
      </div>
      <div class="map-scroll" id="map-scroll">
        <div class="map-wrap">
          <button id="world-prev" class="world-arrow prev" aria-label="Previous world">‹</button>
          <div class="map" id="map">
            <svg id="map-path" viewBox="0 0 1000 1790" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div id="map-nodes"></div>
            <img id="map-bee" class="map-bee" alt="" />
            <p id="map-blurb" class="map-blurb"></p>
            <div class="map-lock"><span class="map-lock-icon">🔒</span><span id="map-lock-text"></span></div>
          </div>
          <button id="world-next" class="world-arrow next" aria-label="Next world">›</button>
        </div>
      </div>
    </section>

    <!-- Level preview card -->
    <div id="level-card" class="modal hidden" role="dialog" aria-modal="true">
      <div class="card level-card">
        <button id="lc-close" class="lc-close" aria-label="Close">×</button>
        <div class="lc-badge"><img id="lc-fruit" alt="" /></div>
        <p class="lc-level" id="lc-level"></p>
        <h2 id="lc-name"></h2>
        <div id="lc-stars" class="lc-stars"><span>★</span><span>★</span><span>★</span></div>
        <div class="lc-goal-box">
          <span class="lc-label">Goal</span>
          <div id="lc-goal" class="lc-goal"></div>
          <span class="lc-moves"><b id="lc-moves"></b> moves</span>
          <span id="lc-tip" class="lc-tip"></span>
        </div>
        <label class="lc-boost" id="lc-boost"><input type="checkbox" id="lc-bee" /> 🐝 Bee Start <small id="lc-bee-n"></small></label>
        <button id="lc-play" class="big-btn lc-play">Play</button>
        <p id="lc-lives" class="lc-lives"></p>
      </div>
    </div>

    <!-- Result modal -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="card">
        <h2 id="modal-title"></h2>
        <div id="modal-stars" class="modal-stars"><span>★</span><span>★</span><span>★</span></div>
        <p id="modal-score"></p>
        <p id="modal-note"></p>
        <div id="modal-sticker" class="modal-sticker hidden"></div>
        <div class="modal-btns">
          <button id="btn-modal-levels" class="mid-btn ghost">Levels</button>
          <button id="btn-modal-retry" class="mid-btn ghost">Retry</button>
          <button id="btn-modal-next" class="mid-btn">Next</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
